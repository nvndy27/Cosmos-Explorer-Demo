# Example only: adapt to the chosen static host and test the deployed site.
# Serve this as an HTTP response header. Do not add this policy only to meta
# if you require frame protection: frame-ancestors is ignored in meta CSP.
Content-Security-Policy: default-src 'self'; base-uri 'none'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'none'; frame-ancestors 'none'
Referrer-Policy: strict-origin-when-cross-origin
X-Content-Type-Options: nosniff
X-Frame-Options: DENY

# HTTPS sites only; enable HSTS only after the domain is permanently served
# over HTTPS and all subdomains are ready. Start without preload.
Strict-Transport-Security: max-age=31536000
